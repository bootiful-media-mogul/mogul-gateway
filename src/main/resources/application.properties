server.shutdown=immediate
#
server.port=1010
# trust the X-Forwarded-* headers from a front-facing load balancer / ingress (e.g. GKE),
# so request.uri() reflects the real external scheme/host/port (https) rather than the
# plain-http hop the pod actually receives.
server.forward-headers-strategy=framework
# rabbitmq
spring.rabbitmq.host=${RMQ_HOST}
spring.rabbitmq.username=${RMQ_USERNAME}
spring.rabbitmq.password=${RMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RMQ_VIRTUAL_HOST}
#
# mogul
mogul.amqp.settings-events=${MOGUL_SETTINGS_EVENTS_DESTINATION_NAME:mogul-settings-events}
#
# spring cloud gateway server *mvc* puts its router function holder in refresh scope (so
# that properties-defined routes can be reloaded), and GenericScope rewrites any such bean
# definition to take the live RefreshScope instance as a constructor argument -- which AOT
# cannot generate code for, so the native build dies on 'gatewayRouterFunctionHolder'.
# every route here is a RouterFunction bean defined in java, so there is nothing to reload.
spring.cloud.refresh.enabled=false
#
# actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
#
# routing
mogul.gateway.api-prefix=/api/
mogul.gateway.api=${MOGUL_SERVICE_HOST:http://127.0.0.1:8080}
mogul.gateway.ui-prefix=/
mogul.gateway.ui=${MOGUL_CLIENT_HOST:http://127.0.0.1:5173}
#
spring.threads.virtual.enabled=true
#
# auth0
auth0.audience=${auth0.domain}api/v2/
#
# logging
logging.level.com.joshlong=debug
logging.level.org.springframework.security=debug
logging.level.org.springframework.cloud.gateway=debug